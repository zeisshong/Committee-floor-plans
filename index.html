<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com;  style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self'; connect-src https://accounts.google.com/gsi/ https://sheets.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>閱讀台灣・鄰居筆記</title><link rel="stylesheet" href="style.css"><body><header><div><small>PRIVATE NEIGHBORHOOD NOTEBOOK</small><h1>閱讀台灣 <span>鄰居筆記</span></h1></div><div class="actions"><button id="authorize">Google 授權並載入資料</button><button id="logout">登出 / 清除資料</button><button id="import" hidden>匯入 CSV / 備份</button><button id="export">下載位置備份</button><input id="file" type="file" accept=".csv,.json" hidden></div></header><main><section class="workspace"><div class="toolbar"><nav><button data-floor="1F" class="active">一樓</button><button data-floor="2F">2F</button><button data-floor="3F">3F</button><button data-floor="4F">4F</button><button data-floor="5F">5F</button><button data-floor="B1">B1 停車場</button><button data-floor="B2">B2</button><button data-floor="B3">B3</button><select id="floorPicker" aria-label="選擇樓層"></select></nav><div><button id="minus" aria-label="縮小">−</button><button id="fit">適合畫面</button><button id="plus" aria-label="放大">＋</button><button id="draw">框選位置</button></div></div><div class="mapcaption"><span id="maptitle">一樓平面圖</span><span>原始圖面 · 拖曳移動 · 滾輪捲動</span></div><div id="viewport"><div id="stage"><img id="plan" src="1f-source.jpg" draggable="false" alt="一樓原始平面圖"><svg id="overlay" viewBox="0 0 1888 1335" aria-label="可互動的位置標記"></svg></div></div><section id="floorGrid" hidden></section><div class="legend"><span>● 已核對圖面標記</span><span class="amber">▧ 待核對位置</span><span id="mappingCount"></span></div><p class="hint" id="maphint">Google 授權後可查看住戶資料。圖上虛線為待核對區域。</p></section><aside><label class="search"><span>搜尋鄰居</span><input id="search" type="search" placeholder="戶別、姓名、LINE、車位、專長…"></label><div class="stats" id="stats"></div><button id="backResults" hidden>← 返回搜尋結果</button><div id="results"></div><section id="detail" class="card"></section></aside></main><footer><span id="status" role="status">公開平面圖；住戶資料須經 Google 授權才能載入。</span><label><input id="remember" type="checkbox">在此瀏覽器記住位置設定</label><button id="clear">清除住戶資料</button><a href="README.md">使用說明</a></footer><dialog id="editor"><form id="mappingForm"><h2>設定圖面位置</h2><p>依原圖核對後，綁定資料中的戶別或車位。</p><label>位置名稱<input id="maplabel" required maxlength="80" placeholder="例如：西側店舖"></label><label>對應類型<select id="kind"><option value="unit">戶別</option><option value="parking">車位</option><option value="space">公共空間 / 尚未對應</option></select></label><label>資料代號<input id="mapkey" maxlength="80" placeholder="例如 A1-1 或 B1-251"><small>戶別採「棟別＋戶別－樓層」，例如 A1-1。車位請含樓層。</small></label><label class="check"><input id="verified" type="checkbox">我已核對位置與代號</label><div class="actions"><button type="button" id="deleteMap">刪除此標記</button><button type="button" id="cancel">取消</button><button class="primary" type="submit">儲存位置</button></div></form></dialog><script src="parking-plans.js"></script><script src="residential-plans.js"></script><script src="app.js"></script><script src="google-config.js"></script><script src="google-auth.js"></script><script src="https://accounts.google.com/gsi/client" async defer></script></body></html>
